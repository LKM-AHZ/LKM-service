name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # 手动触发：`deploy` job 只在此事件下运行（见该 job 的 if）。
  workflow_dispatch:

# 最小权限：本工作流只读代码（不推代码、不建 release、不评论 PR）。
# 不声明则继承仓库/组织默认 token 权限（历史上可能是读写）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_RUNNING: "1"

jobs:
  lint:
    name: lint（ruff + import-linter 边界门禁 + 裸 SQL 门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app auth tests scripts
      - run: uv run lint-imports
      - run: uv run python scripts/check_raw_sql.py

  typecheck:
    # 蓝图 §6.4 的 CI 环节里有「类型」。**刻意非阻断**：存量 ty 诊断（91 条）尚未清零，
    # 先提供可见性（每次 PR 都能看到类型问题在增还是在减），待清零后再去掉
    # continue-on-error 收成阻断门禁。此处的 `continue-on-error` 是 job 级——
    # 失败会标红但不影响工作流结论，避免「一加就红、人人绕过」。
    name: type（ty check，非阻断）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ty check app auth

  migrations:
    name: migrations（逐 revision 双向离线 SQL）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/check_migrations.py

  test:
    name: test（pytest + 真 PG）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          # CI 专用的一次性口令：只喂给本工作流临时起的 PG（service container / Testcontainers），
          # 外部不可达。要换就设仓库变量 CI_POSTGRES_PASSWORD（下面各处读同一个变量，保证服务端
          # 与客户端口令一致）；这样 YAML 里不再示范「口令字面量写进 workflow」——那种写法最
          # 容易被照抄到非临时环境。
          POSTGRES_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
          POSTGRES_DB: lkm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LKM_DB_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
      LKM_AUTH_DB_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
      # 刻意不设 LKM_REDIS_URL：Redis 相关单测走 fakeredis / fail-open 路径
      # （设了真实 Redis 会让「Redis 不可用应直改 DB」这类断言失真）。
      # 真实 Redis 由 integration job 的 Testcontainers 提供。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      # auth 独立库（fixture 需要）：业务库由 service 建出，auth 库需显式建
      - name: 建 auth 库
        env:
          PGPASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
        run: psql -h localhost -U postgres -c "CREATE DATABASE lkm_auth"
      - name: pytest（默认排除 integration）
        run: uv run pytest -q

  integration:
    # 两个 L2 后端各跑一遍同套集成测试：换成 Dragonfly 时靠这条 matrix 保证 RESP 兼容
    # 行为不回退。fail-fast: false —— 任一后端失败不影响另一个出结果，看到完整对照。
    # 版本须与 deploy/k8s/components/redis-dragonfly/patch-redis.yaml 一致。
    name: "integration（Redis=${{ matrix.redis_image }}）"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        redis_image:
          - redis:7-alpine
          - docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2
    env:
      LKM_IT_USE_TESTCONTAINERS: "1"
      LKM_IT_REDIS_IMAGE: ${{ matrix.redis_image }}
      LKM_DB_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
      LKM_AUTH_DB_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Testcontainers 刻意**不进 pyproject/lock**：它只在集成 job 需要，装进主依赖会让
      # 所有镜像与本地环境都背上它（且改 lock 会击穿镜像依赖层缓存）。用 --with 临时装，
      # 但必须钉死版本：>=4.8 每次跑都重新解析，上游发新版会在零代码改动下改变行为。
      # 钉在当前解析到的 4.15.0（即本 CI 一直实际运行的版本）。
      - name: pytest -m integration（Testcontainers）
        run: uv run --with 'testcontainers[postgres,redis]==4.15.0' pytest -m integration -q

  image:
    name: image（docker build）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: lkm-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # 蓝图 §6.4 的 CI/CD 链路末段（…→ 构建镜像 → 部署）。**只在手动触发时运行**：
    # 集群滚动更新的时机属人工决策，push/PR 绝不自动上线。
    #
    # 生产 environment 可配置人工审批；只允许默认发布分支手动上线。
    # 清单在父仓库，集群需预先 apply；本 job 更新所有 lkm-service Deployment 的镜像。
    name: deploy（手动：推镜像并滚动更新集群）
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: [lint, migrations, test, integration, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 校验镜像仓配置
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
        run: |
          if [ -z "$REGISTRY_IMAGE" ]; then
            echo "::error::未配置仓库变量 REGISTRY_IMAGE（如 ghcr.io/<owner>/lkm-service）。"
            echo "deploy 需要它作为镜像名与推送目标；未配置即失败，避免「静默跳过」被误读成已部署。"
            exit 1
          fi
      - name: 安装 kubectl
        run: |
          version=v1.31.0
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl" -o "$RUNNER_TEMP/kubectl"
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl.sha256" -o "$RUNNER_TEMP/kubectl.sha256"
          expected=$(cat "$RUNNER_TEMP/kubectl.sha256")
          echo "$expected  $RUNNER_TEMP/kubectl" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: 配置集群凭据
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo '::error::production environment 缺少 KUBE_CONFIG_B64 secret'
            exit 1
          fi
          umask 077
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" config current-context
      - name: 登录镜像仓
        # 用 docker CLI 而非第三方 login action：本工作流其余动作都按 SHA 钉死，
        # 不引入一个无法钉版本的新action（少一条供应链面）。
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login "${REGISTRY_HOST:-ghcr.io}" \
            -u "$REGISTRY_USER" --password-stdin
      - name: 构建并推送
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # 双标签：不可变（commit SHA，回滚可定位）+ 可变（分支名，便于运维取最新）
          tags: |
            ${{ vars.REGISTRY_IMAGE }}:${{ github.sha }}
            ${{ vars.REGISTRY_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 滚动部署并等待就绪
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
          KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'lkm' }}
          IMAGE_SHA: ${{ github.sha }}
        run: bash scripts/deploy_k8s.sh "${REGISTRY_IMAGE}:${IMAGE_SHA}" "$KUBE_NAMESPACE"
      - name: 记录部署结果
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
          KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'lkm' }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### 已滚动部署至 ${KUBE_NAMESPACE}"
            echo ""
            echo '```'
            echo "${REGISTRY_IMAGE}:${IMAGE_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
