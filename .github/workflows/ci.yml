name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # 手动触发：`deploy` job 只在此事件下运行（见该 job 的 if）。
  workflow_dispatch:

# 最小权限：本工作流只读代码（不推代码、不建 release、不评论 PR）。
# 不声明则继承仓库/组织默认 token 权限（历史上可能是读写）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_RUNNING: "1"

jobs:
  lint:
    name: lint（ruff + import-linter 边界门禁 + 裸 SQL 门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app auth tests scripts
      - run: uv run lint-imports
      - run: uv run python scripts/check_raw_sql.py

  typecheck:
    # 蓝图 §6.4 的 CI 环节里有「类型」。**刻意非阻断**：存量 ty 诊断（91 条）尚未清零，
    # 先提供可见性（每次 PR 都能看到类型问题在增还是在减），待清零后再去掉
    # continue-on-error 收成阻断门禁。此处的 `continue-on-error` 是 job 级——
    # 失败会标红但不影响工作流结论，避免「一加就红、人人绕过」。
    name: type（ty check，非阻断）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ty check app auth

  migrations:
    name: migrations（逐 revision 双向离线 SQL）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/check_migrations.py

  test:
    name: test（pytest + 真 PG）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          # CI 专用的一次性口令：只喂给本工作流临时起的 PG（service container / Testcontainers），
          # 外部不可达。要换就设仓库变量 CI_POSTGRES_PASSWORD（下面各处读同一个变量，保证服务端
          # 与客户端口令一致）；这样 YAML 里不再示范「口令字面量写进 workflow」——那种写法最
          # 容易被照抄到非临时环境。
          POSTGRES_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
          POSTGRES_DB: lkm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LKM_DB_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
      LKM_AUTH_DB_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
      # 刻意不设 LKM_REDIS_URL：Redis 相关单测走 fakeredis / fail-open 路径
      # （设了真实 Redis 会让「Redis 不可用应直改 DB」这类断言失真）。
      # 真实 Redis 由 integration job 的 Testcontainers 提供。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      # auth 独立库（fixture 需要）：业务库由 service 建出，auth 库需显式建
      - name: 建 auth 库
        env:
          PGPASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
        run: psql -h localhost -U postgres -c "CREATE DATABASE lkm_auth"
      - name: pytest（默认排除 integration）
        run: uv run pytest -q

  integration:
    name: integration（Testcontainers 起 PG/Redis/Pulsar）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LKM_IT_USE_TESTCONTAINERS: "1"
      LKM_DB_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
      LKM_AUTH_DB_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'postgres' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Testcontainers 刻意**不进 pyproject/lock**：它只在集成 job 需要，装进主依赖会让
      # 所有镜像与本地环境都背上它（且改 lock 会击穿镜像依赖层缓存）。用 --with 临时装，
      # 但必须钉死版本：>=4.8 每次跑都重新解析，上游发新版会在零代码改动下改变行为。
      # 钉在当前解析到的 4.15.0（即本 CI 一直实际运行的版本）。
      - name: pytest -m integration（Testcontainers）
        run: uv run --with 'testcontainers[postgres,redis]==4.15.0' pytest -m integration -q

  image:
    name: image（docker build）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: lkm-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # 蓝图 §6.4 的 CI/CD 链路末段（…→ 构建镜像 → 部署）。**只在手动触发时运行**：
    # 集群滚动更新的时机属人工决策，push/PR 绝不自动上线。
    #
    # 边界（刻意）：本仓库是应用子仓库，**部署清单在父仓库**（`deploy/k8s/` 的 Kustomize
    # 与 `docker-compose.yml`），本 CI 的工作目录看不到它们，也没有集群凭证约定，
    # 故这里只做「**产出版本化镜像并推到镜像仓**」这一半——它正是本仓库的交付物；
    # 集群侧 `kubectl apply -k deploy/k8s/overlays/prod` 仍按 DEPLOYMENT.md 由运维执行
    # （何时上线是运维决策，不是 CI 能猜的）。未配 registry 时该 job 会显式失败并说明原因，
    # 而不是静默跳过（静默跳过会让人以为「跑过了」）。
    name: deploy（手动：推送版本化镜像）
    if: github.event_name == 'workflow_dispatch'
    needs: [lint, migrations, test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 校验镜像仓配置
        env:
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
        run: |
          if [ -z "$REGISTRY_IMAGE" ]; then
            echo "::error::未配置仓库变量 REGISTRY_IMAGE（如 ghcr.io/<owner>/lkm-service）。"
            echo "deploy 需要它作为镜像名与推送目标；未配置即失败，避免「静默跳过」被误读成已部署。"
            exit 1
          fi
      - name: 登录镜像仓
        # 用 docker CLI 而非第三方 login action：本工作流其余动作都按 SHA 钉死，
        # 不引入一个无法钉版本的新action（少一条供应链面）。
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login "${REGISTRY_HOST:-ghcr.io}" \
            -u "$REGISTRY_USER" --password-stdin
      - name: 构建并推送
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # 双标签：不可变（commit SHA，回滚可定位）+ 可变（分支名，便于运维取最新）
          tags: |
            ${{ vars.REGISTRY_IMAGE }}:${{ github.sha }}
            ${{ vars.REGISTRY_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 输出后续运维步骤
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "${{ vars.REGISTRY_IMAGE }}:${{ github.sha }}"
            echo '```'
            echo ""
            echo "集群侧上线（在父仓库执行，清单不在本仓库）："
            echo ""
            echo '```sh'
            echo "kubectl -n lkm set image deploy/backend backend=${{ vars.REGISTRY_IMAGE }}:${{ github.sha }}"
            echo "# 或整体重放清单：kubectl apply -k deploy/k8s/overlays/prod"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
