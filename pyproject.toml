[project]
name = "backend"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "pydantic[email]>=2.13.4",
    "fastapi[standard]>=0.139.2",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "httpx>=0.28.0",
    "cbor2>=5.6.0",
    "strawberry-graphql>=0.263.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9",
    "webauthn>=2,<3",
    "argon2-cffi>=23.1.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.4",
    "sentry-sdk>=2.0",
    "boto3>=1.35.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pulsar-client>=3.13.0",
    "msgspec>=0.21.1",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "prefect>=3.8.5,<4",
    # [async] extra 必需：不加则 get_async_client 在运行期 ImportError（缺 aiohttp）
    "clickhouse-connect[async]>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_functions = ["test_*", "should_*"]
asyncio_mode = "auto"
markers = [
    "integration: 需真实 Redis 的集成测试，默认排除，用 `uv run pytest -m integration` 显式运行",
]
addopts = ["-m", "not integration"]
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
]

[tool.basedpyright]
include = ["app", "auth"]
typeCheckingMode = "standard"
reportOverlappingOverload = false
reportUnknownArgumentType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnknownMemberType = true
reportUnknownLambdaType = true
reportMissingParameterType = true
reportMissingTypeStubs = false
reportUnannotatedClassAttribute = true
reportUnusedCallResult = false
reportUnusedImport = true
reportUnusedVariable = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "alembic>=1.13.0",
    "basedpyright>=1.39.9",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16",
    "ty>=0.0.70",
    "fakeredis>=2.22.0",
    "locust>=2.46.3",
    "moto>=5.0.0",
    "import-linter>=2.0",
    "hypothesis>=6.112",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["alembic", "alembic_auth", "blog_repos"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "SIM", "ASYNC", "PERF", "ANN"]
ignore = [
    "RUF001",  # 中文全角标点/破折号非 bug，保留中文风格
    "RUF002",
    "RUF003",
    "ANN401",  # 后端在 ORM/stub 边界刻意用 Any
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Security",
    "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Cookie", "fastapi.Body", "fastapi.Form", "fastapi.File",
    "auth.deps.RequireLevel",
    "app.modules.rbac.deps.RequirePermission",
    "app.core.common.PaginateDep",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]  # 测试函数不强制返回类型标注
"main.py" = ["F401"]       # from app.main import app 是 uvicorn 入口

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"

# 架构边界门禁。
# 允许依赖：modules/* → core/*（基础）、modules/A → modules/B（仅 B.__init__ 公共 API）、
# api/main → modules（聚合层）。禁止：core/*→modules/*、db/*→modules/*。
# auth 是顶层包：auth → app.core/app.db（基础设施）允许；app → auth 只允许走
# auth 公开面（auth / auth.deps / auth.schemas / auth.snapshot / auth.seams / auth.entities）。
# 下发是"指令式理想边界"，对架构固有的注册/消费路径用 ignore_imports 精确豁免
# （注册枢纽、worker 消费业务、调度的降级分支、共享 repo 辅助等），其余强制。
[tool.importlinter]
# auth 已独立成顶层包（auth/ 与 app/ 同级），两个顶层的包同受契约约束。
root_packages = ["app", "auth"]

[[tool.importlinter.contracts]]
name = "边界: core 不依赖业务模块"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]
# allow_indirect_imports=true：只检查**直接** core→modules import（杜绝新增业务直连），
# 放行经桥接模块（db.model_registry/session 等在各自契约已豁免）的既有间接路径。
allow_indirect_imports = "true"
# 既定的跨切/注册耦合（见 P4-T3 审计），逐一精确允许，防止任意 core→modules：
ignore_imports = [
    "app.core.task_registry -> app.modules.blog.tasks",  # 任务注册枢纽
    "app.core.task_registry -> app.modules.content.tasks",  # 任务注册枢纽（M6.10 计数落库/对账）
    "app.core.task_registry -> app.modules.feed.tasks",  # 任务注册枢纽（M6.11 时间线 fanout）
    "app.core.task_registry -> app.modules.files.tasks",  # 任务注册枢纽
    "app.core.task_registry -> app.modules.interaction.tasks",  # 任务注册枢纽
    "app.core.task_registry -> app.modules.notification.tasks",  # 任务注册枢纽
    "app.core.task_registry -> app.modules.points.tasks",  # 任务注册枢纽
    # app.core.throttle -> auth.errors 已随 M3-peer 摘环移除(AuthErr 并 app.core.err)
    "app.core.worker_dlq -> app.modules.admin.models",  # worker 消费业务模型(DlqMessage)
]

[[tool.importlinter.contracts]]
name = "边界: db 层不反向依赖业务模块"
type = "forbidden"
source_modules = ["app.db"]
forbidden_modules = ["app.modules"]
# 模型注册枢纽 + 共享 repo/seed 辅助：
ignore_imports = [
    "app.db.init_db -> app.modules.rbac.seed",  # schema 就绪后种 RBAC 默认权限
    "app.db.model_registry -> auth",  # 经 auth 公开钩子注册 auth 模型（其内部再达 storage 基础设施）
    "app.db.model_registry -> app.modules.admin.models",  # 模型预注册枢纽
    "app.db.model_registry -> app.modules.articles.models",
    "app.db.model_registry -> app.modules.blog.models",
    "app.db.model_registry -> app.modules.content.models",
    "app.db.model_registry -> app.modules.exam.models",
    "app.db.model_registry -> app.modules.files.models",
    "app.db.model_registry -> app.modules.feed.models",
    "app.db.model_registry -> app.modules.interaction.models",
    "app.db.model_registry -> app.modules.notification.models",
    "app.db.model_registry -> app.modules.points.models",
    "app.db.model_registry -> app.modules.projects.models",
    "app.db.model_registry -> app.modules.starhope.models",
]

[[tool.importlinter.contracts]]
name = "边界: 业务模块间不任意依赖(须走公共API/白名单)"
type = "forbidden"
source_modules = ["app.modules.admin","app.modules.articles","app.modules.blog","app.modules.content","app.modules.exam","app.modules.feed","app.modules.files","app.modules.interaction","app.modules.notification","app.modules.points","app.modules.projects","app.modules.search","app.modules.starhope"]
forbidden_modules = ["app.modules.admin","app.modules.articles","app.modules.blog","app.modules.content","app.modules.exam","app.modules.feed","app.modules.files","app.modules.interaction","app.modules.notification","app.modules.points","app.modules.projects","app.modules.search","app.modules.starhope"]
allow_indirect_imports = "true"
ignore_imports = [
    "app.modules.content.boards.router -> app.modules.admin.deps",
    "app.modules.content.columns.router -> app.modules.admin.deps",
    "app.modules.files.router -> app.modules.admin.deps",
    "app.modules.projects.router -> app.modules.admin.deps",
    "app.modules.content.models -> app.modules.feed.models",
    "app.modules.articles.service -> app.modules.points.rules",
    "app.modules.content.service -> app.modules.points.rules",
    "app.modules.content.service -> app.modules.points.service",
    "app.modules.exam.service -> app.modules.points.rules",
    "app.modules.files.service -> app.modules.points.rules",
    "app.modules.content.repository -> app.modules.exam.models",  # 发帖认证判定读考试证书表
    "app.modules.content.service -> app.modules.feed.fanout",  # 内容软删时清物化 feed 残留(批 4)
    "app.modules.blog.router -> app.modules.content.schemas",
    "app.modules.blog.router -> app.modules.content.service",
    "app.modules.blog.repository -> app.modules.content.models",
    "app.modules.blog.service -> app.modules.content.service",
    "app.modules.admin.content_router -> app.modules.articles.service",
    "app.modules.admin.content_router -> app.modules.blog.service",
    "app.modules.admin.content_router -> app.modules.content.schemas",
    "app.modules.admin.content_router -> app.modules.content.service",
    "app.modules.admin.users_router -> app.modules.content.models",
    "app.modules.admin.users_router -> app.modules.files.models",
    "app.modules.feed.feed -> app.modules.articles.models",
    "app.modules.feed.feed -> app.modules.content.models",
    "app.modules.feed.feed -> app.modules.projects.models",
    "app.modules.feed.service -> app.modules.admin.moderation.engine",
    "app.modules.feed.repository -> app.modules.content.models",
    "app.modules.feed.models -> app.modules.content.models",
    "app.modules.interaction.repository -> app.modules.content.models",  # 收藏计数/摘要读内容表
    "app.modules.notification.tasks -> app.modules.content.models",  # 事件解析目标内容/评论作者
    "app.modules.search.repository -> app.modules.content.models",  # 检索只读内容表
    "app.modules.content.counters -> app.modules.interaction.models",  # bookmark 计数对账真相源
]

[[tool.importlinter.contracts]]
name = "边界: app 仅经 auth 公开面引用 auth"
type = "forbidden"
# 公开面（白名单，不在 forbidden 内即天然放行）：
#   auth / auth.deps / auth.schemas / auth.snapshot / auth.seams / auth.entities
# 其余 auth 子模块均为内部实现，app 侧不得直接 import；新增 auth 内部模块须补列于此。
source_modules = ["app"]
forbidden_modules = [
    "auth.admin_router",
    "auth.admin_session",
    "auth.audit_export",
    "auth.channels",
    "auth.db",
    "auth.errors",
    "auth.events",
    "auth.health",
    "auth.jwt_keys",
    "auth.limits",
    "auth.main",
    "auth.models",
    "auth.providers",
    "auth.register",
    "auth.repository",
    "auth.router",
    "auth.router_2fa",
    "auth.router_authz",
    "auth.router_jwks",
    "auth.router_oauth",
    "auth.router_onboarding",
    "auth.router_passkey",
    "auth.router_read",
    "auth.router_recovery",
    "auth.router_settings",
    "auth.security",
    "auth.service",
    "auth.service_2fa",
    "auth.service_auth",
    "auth.service_authz",
    "auth.service_oauth",
    "auth.service_onboarding",
    "auth.service_passkey",
    "auth.service_recovery",
    "auth.service_verify",
    "auth.tasks",
    "auth.user_dim_sync",
    "auth.user_http",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "边界: auth 不反向依赖 app 业务面"
type = "forbidden"
source_modules = ["auth"]
forbidden_modules = ["app.modules", "app.api", "app.ws", "app.flows", "app.main"]
allow_indirect_imports = "true"
ignore_imports = [
    # 共享存储抽象（与业务域共用的基础设施，非业务逻辑）
    "auth.service -> app.modules.storage.base",
    "auth.service -> app.modules.storage.errors",
    "auth.service -> app.modules.storage.factory",
    # 离线报表导出复用 analytics flow 的既有入口（惰性调用）
    "auth.tasks -> app.flows.analytics_body",
]
