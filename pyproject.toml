[project]
name = "backend"
version = "0.1.2"
description = "理科迷社区后端服务"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "pydantic[email]>=2.14.1",
    "fastapi[standard]>=0.162.0",
    "sqlalchemy>=2.1.6",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "cbor2>=6.1.5",
    "strawberry-graphql>=0.338.0",
    "asyncpg>=0.32.0",
    "psycopg2-binary>=2.9.13",
    "webauthn>=3.0.1,<4",
    "argon2-cffi>=25.1.0",
    "redis>=8.1.0",
    "sentry-sdk>=2.73.0",
    "boto3>=1.43.119",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pulsar-client>=3.13.0",
    "msgspec>=0.22.0",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "prefect>=3.9.0,<4",
    "clickhouse-connect[async]>=1.11.0",
    "meilisearch>=0.43.0",
    "opensearch-py>=3.2.0",
    "pillow>=13.0.0",
    "aio-pika>=10.2.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_functions = ["test_*", "should_*"]
asyncio_mode = "auto"
markers = [
    "integration: 需真实 Redis 的集成测试，默认排除，用 `uv run pytest -m integration` 显式运行",
    # tests/deploy 的前提声明（判定逻辑见 tests/deploy/conftest.py）：缺哪项跳哪项，
    # 而不是"要么全跑要么全跳"。未标注的用例默认 requires_root。
    "requires_root: tests/deploy 用例需要根仓库（docker-compose.yml + deploy/）",
    "requires_bot: 额外需要 LKM-bot 子模块源码（如逐字比对 bot SSO 字面量）",
]
addopts = ["-m", "not integration"]
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
]

[tool.basedpyright]
include = ["core", "app", "auth"]
typeCheckingMode = "standard"
reportOverlappingOverload = false
reportUnknownArgumentType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnknownMemberType = true
reportUnknownLambdaType = true
reportMissingParameterType = true
reportMissingTypeStubs = false
reportUnannotatedClassAttribute = true
reportUnusedCallResult = false
reportUnusedImport = true
reportUnusedVariable = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "alembic>=1.20.1",
    "basedpyright>=1.40.2",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "ty>=0.0.92",
    "fakeredis>=2.40.0",
    "locust>=2.47.0",
    "moto>=5.2.4",
    "import-linter>=2.15",
    "hypothesis>=6.170.12",
    "pyyaml>=6.0.3",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["alembic", "alembic_auth", "blog_repos"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "SIM", "ASYNC", "PERF", "ANN"]
ignore = [
    "RUF001",  # 中文全角标点/破折号非 bug，保留中文风格
    "RUF002",
    "RUF003",
    "ANN401",  # 后端在 ORM/stub 边界刻意用 Any
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Security",
    "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Cookie", "fastapi.Body", "fastapi.Form", "fastapi.File",
    "core.ports.authz.RequireLevel",
    "app.modules.rbac.deps.RequirePermission",
    "core.common.PaginateDep",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]  # 测试函数不强制返回类型标注
"main.py" = ["F401"]       # from boot.backend import app 是 uvicorn 入口

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
# 测试大量使用 monkeypatch 与 ASGI 桩，ty 无法可靠推断其动态类型；
# 业务源码、压测与运维脚本仍全部纳入检查。
exclude = ["tests"]

# 架构边界门禁。
# 允许：app → core、auth → core、boot → {app, auth, core}；
# 禁止：core → {app, auth, boot}；app 与 auth 之间任何方向的直接 import。
# 两侧的跨包协作一律走 core 的注册表与端口，由组合根 boot/assemble 完成装配。
[tool.importlinter]
root_packages = ["core", "app", "auth", "boot"]

[[tool.importlinter.contracts]]
name = "边界: core 不依赖 app/auth/boot"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["app", "auth", "boot"]
allow_indirect_imports = "false"

[[tool.importlinter.contracts]]
name = "边界: app 不依赖 auth/boot"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["auth", "boot"]
allow_indirect_imports = "false"

[[tool.importlinter.contracts]]
name = "边界: auth 不依赖 app/boot"
type = "forbidden"
source_modules = ["auth"]
forbidden_modules = ["app", "boot"]
allow_indirect_imports = "false"

# rbac 是业务侧共享鉴权原语；对象存储抽象位于 core.storage。
[[tool.importlinter.contracts]]
name = "边界: 业务模块间不任意依赖(须走公共API/白名单)"
type = "forbidden"
source_modules = ["app.modules.admin","app.modules.content","app.modules.exam","app.modules.feed","app.modules.files","app.modules.interaction","app.modules.notification","app.modules.points","app.modules.projects","app.modules.search","app.modules.starhope","app.modules.treehole"]
forbidden_modules = ["app.modules.admin","app.modules.content","app.modules.exam","app.modules.feed","app.modules.files","app.modules.interaction","app.modules.notification","app.modules.points","app.modules.projects","app.modules.search","app.modules.starhope","app.modules.treehole"]
allow_indirect_imports = "true"
ignore_imports = [
    "app.modules.treehole.services.reports -> app.modules.admin.models",  # 匿名举报进入后台审核队列
    "app.modules.content.boards.router -> app.modules.admin.deps",
    "app.modules.content.columns.router -> app.modules.admin.deps",
    "app.modules.files.router -> app.modules.admin.deps",
    "app.modules.projects.router -> app.modules.admin.deps",
    "app.modules.content.models -> app.modules.interaction.models",  # Board.followers 关系目标
    "app.modules.content.articles.service -> app.modules.points.rules",  # 文章发布走积分规则
    "app.modules.content.service -> app.modules.points.rules",
    "app.modules.content.service -> app.modules.points.service",
    "app.modules.exam.service -> app.modules.points.rules",
    "app.modules.files.service -> app.modules.points.rules",
    "app.modules.files.service -> app.modules.projects.models",  # 校验项目归属与成员
    "app.modules.files.repository -> app.modules.projects.models",  # 密件列表按项目成员过滤
    "app.modules.content.repository -> app.modules.exam.models",  # 发帖认证判定读考试证书表
    "app.modules.content.service -> app.modules.feed.fanout",  # 内容软删时清物化 feed 残留(批 4)
    "app.modules.interaction.service -> app.modules.feed.fanout",  # 关注/取关驱动物化 feed 回填与清理
    "app.modules.feed.service -> app.modules.interaction.service",  # 时间线读关注集合用于过滤
    "app.modules.feed.fanout -> app.modules.interaction.service",  # 受众面读关注关系（懒 import）
    "app.modules.admin.content_router -> app.modules.content.articles.service",
    "app.modules.admin.content_router -> app.modules.content.blog.service",
    "app.modules.admin.content_router -> app.modules.content.schemas",
    "app.modules.admin.review_service -> app.modules.content.models",  # 审核队列只读板块/专栏申请
    "app.modules.admin.review_service -> app.modules.files.models",  # 审核队列只读待审文件
    "app.modules.admin.review_service -> app.modules.projects.models",  # 审核队列只读项目申请
    "app.modules.admin.review_digest -> app.modules.notification.service",  # 每日摘要写站内信
    "app.modules.admin.content_router -> app.modules.content.service",
    "app.modules.admin.users_router -> app.modules.content.models",
    "app.modules.admin.users_router -> app.modules.files.models",
    "app.modules.feed.feed -> app.modules.content.articles.models",
    "app.modules.feed.feed -> app.modules.content.models",
    "app.modules.feed.feed -> app.modules.projects.models",
    "app.modules.feed.service -> app.modules.admin.moderation.engine",
    "app.modules.interaction.models -> app.modules.content.models",  # BoardFollow.board 关系目标(TYPE_CHECKING)
    "app.modules.interaction.repository -> app.modules.content.models",  # 收藏计数/摘要 + 板块只读缝
    "app.modules.notification.tasks -> app.modules.content.models",  # 事件解析目标内容/评论作者
    "app.modules.search.repository -> app.modules.content.models",  # 检索只读内容表
    "app.modules.search.documents -> app.modules.content.models",  # 内容行 → 索引文档（B2）
    "app.modules.search.sync -> app.modules.content.models",  # content.* 事件回查行决定 upsert/delete（B2）
    "app.modules.search.repository -> app.modules.files.models",  # 公开文件全文检索
    "app.modules.search.documents -> app.modules.files.models",  # 文件行 → 索引文档
    "app.modules.search.sync -> app.modules.files.models",  # 文件审核变更同步索引
    "app.modules.content.counters -> app.modules.interaction.models",  # bookmark 计数对账真相源
    "app.modules.content.service -> app.modules.admin.models",  # 用户举报写入 reports 表（后台举报队列）
]
