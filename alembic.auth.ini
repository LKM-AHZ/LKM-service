# AUTH 独立库 Alembic 配置（M3.B S1）。与主库的 alembic.ini（monolith 共享库）并列，
# 只管理 auth 自持库的迁移链（script_location = alembic_auth/）。
# 驱动：`alembic -c alembic.auth.ini upgrade head`
#       / env.py 内按 settings.auth_database_url（async 方言会同步化）。
# env.py 仍以 settings 里 auth 库 URL 为准；此 sqlalchemy.url 仅占位、会被 env 覆盖。
# 不变式：本链沿用默认版本表 alembic_version，因此 auth 库**必须**与业务库是物理不同的库
# （默认 lkm_auth ≠ 业务库，tests 亦如此假定）。若把 LKM_AUTH_DB_* 指向业务库，两条链会
# 共用同一张 version 表，upgrade 会按错误的历史执行/报错；此时应改用独立 version_table，
# 但既有部署已按默认名 stamp，改名需要单独的迁移步骤。

[alembic]
# 相对本 ini（%(here)s）的 auth 迁移脚本目录
script_location = %(here)s/alembic_auth

# URL：实际由 env.py 用 settings.auth_database_url 覆盖（async→sync 方言）。
sqlalchemy.url = driver://user:pass@localhost/dbname

# 供 alembic 查找项目模块的 sys.path
# 用 %(here)s（ini 所在目录 = 仓库根）而不是 "."：后者由 alembic 相对**进程 CWD**
# 解析（alembic/script/base.py 直接 sys.path[:0] = 该值），从别的目录驱动迁移时
# 挂进去的是 CWD，既依赖调用位置、又可能让本地模块盖住已安装包。
prepend_sys_path = %(here)s
path_separator = os


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
